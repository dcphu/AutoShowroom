<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLux</title>
    <!-- Ngăn chặn gõ admin link: Nếu chưa có phiên đăng nhập, lập tức đẩy về trang chủ Showroom -->
    <script>
        (function() {
            var session = sessionStorage.getItem('autolux_admin_session');
            if (!session) {
                window.location.replace('../index.html');
            } else {
                window.location.replace('../admin.html');
            }
        })();
    </script>
</head>
<body style="background: #0f172a;">
</body>
</html>
