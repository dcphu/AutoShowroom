<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Header Fragment -->
<div th:fragment="header">
    <!-- Top Announcement Bar (Sáng & Tinh tế) -->
    <div class="top-bar-light py-1">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center small">
                <div class="d-flex align-items-center gap-2">
                    <span class="d-none d-sm-inline"><i class="fa-solid fa-location-dot text-warning me-1"></i> Hà Nội • Đà Nẵng • TP. HCM</span>
                    <span class="d-sm-none"><i class="fa-solid fa-location-dot text-warning me-1"></i> 3 Showroom</span>
                    <span class="d-none d-lg-inline text-muted">• Mở cửa: 08:00 - 21:00</span>
                </div>
                <div class="d-flex align-items-center">
                    <a href="tel:1900888999" class="text-decoration-none text-dark fw-bold small">
                        <i class="fa-solid fa-phone text-warning me-1"></i>
                        <span class="d-none d-sm-inline">Hotline: </span>1900 888 999
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Glassmorphism Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-luxury sticky-top">
        <div class="container">
            <a class="brand-logo" th:href="@{/home}" id="brandLogo" title="AutoLux Motors">
                <div class="brand-icon">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <div>AUTOLUX <span class="highlight">MOTORS</span></div>
            </a>
            
            <button class="navbar-toggler border-0 text-dark p-1" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false">
                <i class="fa-solid fa-bars fs-5"></i>
            </button>
            
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-0">
                    <li class="nav-item">
                        <a class="nav-link nav-link-luxury active" th:href="@{/home}">Trang Chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-luxury" th:href="@{/home#collection}">Bộ Sưu Tập</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-luxury" th:href="@{/home#features}">Đặc Quyền</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-luxury" th:href="@{/home#calculator}">Trả Góp</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-luxury" th:href="@{/home#booking}">Lái Thử</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-luxury" th:href="@{/home#contact}">Liên Hệ</a>
                    </li>
                </ul>
                
                <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
                    <a th:href="@{/home#booking}" class="btn-gold">
                        <i class="fa-solid fa-key"></i>
                        <span class="d-none d-xl-inline">Đặt Lịch Lái Thử</span>
                        <span class="d-xl-none">Lái Thử</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
