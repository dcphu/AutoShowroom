# ==============================================================
# Profile H2 In-Memory (Chạy thử nghiệm không cần bật MySQL)
# Kích hoạt bằng lệnh: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ==============================================================
spring.datasource.url=jdbc:h2:mem:autoshowroom;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
