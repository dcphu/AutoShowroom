version: '3.8'

services:
  # 1. Ứng dụng Web AutoLux Showroom
  web:
    build: .
    container_name: autolux_showroom_web
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/autoshowroom?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      - DB_USER=root
      - DB_PASS=rootpassword
      - ADMIN_USER=admin
      - ADMIN_PASS=AutoLux@2026!
    depends_on:
      - db

  # 2. Cơ sở dữ liệu MySQL 8
  db:
    image: mysql:8.0
    container_name: autolux_showroom_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=autoshowroom
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/java/data/utils/autoshowroom.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data:
