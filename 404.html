<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLux - Đang chuyển hướng...</title>
    <script>
        (function() {
            var pathname = window.location.pathname.toLowerCase();
            if (pathname.includes('/admin')) {
                var session = sessionStorage.getItem('autolux_admin_session');
                if (!session) {
                    sessionStorage.setItem('autolux_redirect_after_login', 'admin.html');
                    window.location.replace('login.html?notice=unauthorized');
                } else {
                    window.location.replace('admin.html');
                }
            } else if (pathname.includes('/login')) {
                window.location.replace('login.html');
            } else if (pathname.includes('/detail')) {
                window.location.replace('detail.html' + window.location.search);
            } else {
                window.location.replace('index.html');
            }
        })();
    </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding-top: 60px; background: #0f172a; color: #f8fafc;">
    <div style="display: inline-block; padding: 24px; border-radius: 12px; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);">
        <p style="margin: 0; font-size: 1.1rem;">Đang chuyển hướng về hệ thống AutoLux...</p>
    </div>
</body>
</html>
