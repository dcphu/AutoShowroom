<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLux Motors</title>
    <!-- Bộ định tuyến thông minh GitHub Pages: Phân luồng Admin & Khách Hàng -->
    <script>
        (function() {
            var pathname = window.location.pathname.toLowerCase();
            var search = window.location.search || '';
            var hash = window.location.hash || '';

            if (pathname.includes('/admin/login') || pathname.includes('/login')) {
                window.location.replace('admin/login.html' + search + hash);
            } else if (pathname.includes('/admin')) {
                var session = sessionStorage.getItem('autolux_admin_session');
                if (!session) {
                    window.location.replace('admin/login.html');
                } else {
                    window.location.replace('admin/index.html' + search + hash);
                }
            } else if (pathname.includes('/detail')) {
                window.location.replace('client/detail.html' + search + hash);
            } else {
                window.location.replace('client/index.html' + search + hash);
            }
        })();
    </script>
</head>
<body style="background: #0f172a; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Đang chuyển hướng hệ thống AutoLux Motors...</p>
</body>
</html>
